appId: com.deepseek.desktop
productName: DeepSeek Harness Desktop
copyright: Copyright © 2026 deepseek-desktop
# 无生产依赖：依赖由外部处理，跳过 install/rebuild 与 node_modules 收集。
beforeBuild: scripts/before-build.js
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
extraResources:
  - from: kernel
    to: kernel
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}.${ext}
